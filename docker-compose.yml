# Local Postgres for development and tests. Credentials are local-only defaults.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cic
      POSTGRES_PASSWORD: cic
      POSTGRES_DB: cic
    ports:
      - "5432:5432"
    volumes:
      - cic-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cic -d cic"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  cic-pgdata:
