[project]
name = "cic-compass-mcp"
version = "0.1.0"
description = "Read-only MCP server for the CIC Compass public API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mcp==2.3.0",
  "httpx==0.28.1",
]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.3", "mypy==2.4.1"]

[tool.uv]
package = false
# Nothing published in the last 14 days (docs/ENGINEERING.md section 3, D-120).
exclude-newer = "2026-10-30T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
